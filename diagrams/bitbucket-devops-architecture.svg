9">- Durable cache stores metadata only; logs, raw diffs, comments, tasks,</text><text fill="#000000" font-family="sans-serif" font-size="9.607" lengthAdjust="spacing" textLength="162.1077" x="1016.9836" y="728.2185">and activity are fetched on demand.</text></g><g class="footer" data-source-line="121"><text fill="#888888" font-family="sans-serif" font-size="6.8621" lengthAdjust="spacing" textLength="349.1792" x="920.95" y="750.7208">One package with shared infrastructure and two feature areas | Automatic Magit pipeline discovery is opt-in</text></g></g></svg>
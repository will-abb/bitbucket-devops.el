0000" font-family="sans-serif" font-size="8.843" lengthAdjust="spacing" textLength="275.7575" x="958.0156" y="647.5376">h history | r run pipeline | l PR list | c create PR | R reviewer cache</text><text fill="#000000" font-family="sans-serif" font-size="8.843" lengthAdjust="spacing" textLength="289.4287" x="951.18" y="659.5816">b branch tracker | o repository tracker | t list trackers | x stop tracker</text><text fill="#000000" font-family="sans-serif" font-size="8.843" lengthAdjust="spacing" textLength="221.4444" x="985.1721" y="671.6257">a auto log downloads | m Magit push tracking toggle</text><text fill="#000000" font-family="sans-serif" font-size="8.843" lengthAdjust="spacing" textLength="2.2992" x="1094.7448" y="683.6697">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="8.843" lengthAdjust="spacing" textLength="26.8559" x="1082.4664" y="695.7137">Notes:</text><text fill="#000000" font-family="sans-serif" font-size="8.843" lengthAdjust="spacing" textLength="287.2003" x="952.2942" y="707.7578">- Pull request pipeline selectors resolve through the PR REST adapter.</text><text fill="#000000" font-family="sans-serif" font-size="8.843" lengthAdjust="spacing" textLength="332.8032" x="929.4928" y="719.8018">- PR comment watcher changes are announced through a lifecycle-scoped hook;</text><text fill="#000000" font-family="sans-serif" font-size="8.843" lengthAdjust="spacing" textLength="302.0653" x="947.1609" y="731.8459">the combined watcher list subscribes only while its buffer mode is active.</text><text fill="#000000" font-family="sans-serif" font-size="8.843" lengthAdjust="spacing" textLength="318.6369" x="936.5759" y="743.8899">- Pull request buffers provide configured-key lookup to the shared command</text><text fill="#000000" font-family="sans-serif" font-size="8.843" lengthAdjust="spacing" textLength="307.4505" x="944.4682" y="755.934">panel through buffer-local callbacks, preserving downward dependencies.</text><text fill="#000000" font-family="sans-serif" font-size="8.843" lengthAdjust="spacing" textLength="305.8412" x="942.9737" y="767.978">- Shared REST owns auth headers, JSON, pagination, redirects, and errors.</text><text fill="#000000" font-family="sans-serif" font-size="8.843" lengthAdjust="spacing" textLength="294.3188" x="948.7349" y="780.0221">- Durable cache stores metadata only; logs, raw diffs, comments, tasks,</text><text fill="#000000" font-family="sans-serif" font-size="8.843" lengthAdjust="spacing" textLength="149.2154" x="1023.5858" y="792.0661">and activity are fetched on demand.</text></g><g class="footer" data-source-line="150"><text fill="#888888" font-family="sans-serif" font-size="6.3164" lengthAdjust="spacing" textLength="352.4354" x="919.6767" y="812.7788">Acyclic internal require graph | Shared infrastructure plus pipeline and pull request features | Magit discovery is opt-in</text></g><?plantuml-src ZLXjR-Eu4VwkNq5il_JGo9TBDydLTxU0upZT59ix8ycYA9fYGKkKHLWcLPAAOpJjR-_Ca9HaMqvkFsmiQZYQ6JxFlD19Lmcsa6xHP2lXqbmywzgEHFMahk8YcrQwoTcrUFwjjcoZpQgezCQomkWrcwrvPfF4wPevpHRQELZCfH6ParebDkEWVyrVsDdPwIdRoDoLIIbpmQmJHcYthKMIs9LKDJTypHOyMosDRbG-rPKsx0ytzAydOKkUwurKIrRmoehUcqegWVgODgxKlHSrAELByU2sO0jQnjMowk_CHS6RoZsA5pUfv5AjXN8iW_-4wKafdGihQdPntbiqNArmyRA_E356Ru837y_Epovc-oyVIvcjbB2M_J3weQykMdUbJIxCCHsTsBln2iw_hIyAlQjDQJSeTNbziI_L_-3DpUJgz3GPyk3ddsVAcUsdJ-m_2MC7kcT_kJa32-1DNz_fwVdPT9hyTrZXZU2kCUAeoZ_VJ6S3Ad-yF9ySK_bGSYFoenediuj38o_EppzEJuzf_AA16iSKtdoyER-vF51uTNdvur6lPoy0LtLSv_LiTZKGoSkFbvCBq9dmpC721o8q-sg5-S2uPGtyI9BsC-p3OAxuvPT788ALo9jhQMlkil99rR8MI4hBNbdTL1LO--z6M8VFpe1zmE8Fh0C0V2uFcvC4CSICN9QEwQ9RP-nMUJ-1jRLGkL3Pbf57x8-GbZ0BbR3hkp68MZgrxtEzvbAnjSwRIbXOJp-nQ1lxUil-nERtR8FgmTVTjpkhwyPnp6gmuOulfMCIJ5aQMWlxUbw2Ph_esj1qtZ7sM0gIX5J9G4TTCcaPpxPP9RCHctj2fZ8u2niARJRSvE1sLd7_KTW0ko5IU4pvA85m4FUI912QVPX7Jm8f8Fq8JYSRVVm6EZX1fdVAyrvuCAmGNVXLyQqmt-5nxwCWRIG1ePGMKBI50yw5uxB2ewxqqZufVnOiq-ir1pDhhaG5BnL_bajo1f7GCRTlO2EF67SN3iGEcjJ2BwM34sHWfbKXbmsQWcRCxrChAa7GDmqgYXvmAc1WeH7m0lvQh76lu81oKZNYkBd-QyCcM_QFo